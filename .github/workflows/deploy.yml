name: Deploy to WordPress.org

# Pushing a version tag publishes that version. Nothing else does, so a
# merge to main is safe and a release is deliberate.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          php -l lucjan-ai-image-disclosure.php
          for f in includes/*.php uninstall.php; do php -l "$f"; done

      - name: Run tests
        run: cd tools && php tests.php

      - name: Check the tag matches the plugin header
        run: |
          naglowek=$(grep -oP '(?<=^ \* Version:)\s*\K[0-9.]+' lucjan-ai-image-disclosure.php)
          readme=$(grep -oP '(?<=^Stable tag: )[0-9.]+' readme.txt)
          echo "tag=${{ github.ref_name }} header=$naglowek readme=$readme"
          test "${{ github.ref_name }}" = "$naglowek"
          test "${{ github.ref_name }}" = "$readme"

      # Dopóki wtyczki nie ma w katalogu, sekretów nie ma i publikacja nie ma
      # dokąd pójść. Bez tego warunku każdy tag kończy się mailem o nieudanym
      # przebiegu, mimo że lint, testy i zgodność wersji przeszły.
      - name: Czy sa poswiadczenia do WordPress.org
        id: svn
        run: echo "ready=${{ secrets.SVN_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - uses: 10up/action-wordpress-plugin-deploy@stable
        if: steps.svn.outputs.ready == 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: lucjan-ai-image-disclosure

      - name: Pominieto publikacje
        if: steps.svn.outputs.ready != 'true'
        run: |
          echo "Brak sekretow SVN_USERNAME / SVN_PASSWORD."
          echo "Kod zostal sprawdzony, ale nic nie poszlo do WordPress.org."
          echo "Dodaj sekrety w Settings -> Secrets and variables -> Actions,"
          echo "gdy wtyczka zostanie przyjeta do katalogu."
