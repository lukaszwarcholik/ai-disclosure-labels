name: Update readme and assets on WordPress.org

# Readme and directory graphics change without a new version: a higher
# "Tested up to", a reworded FAQ, a new banner. This pushes only those.
on:
  push:
    branches:
      - main
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'
      - '.github/workflows/assets.yml'

jobs:
  assets:
    name: Readme and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Czy sa poswiadczenia do WordPress.org
        id: svn
        run: echo "ready=${{ secrets.SVN_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      # Akcja kopiuje .wordpress-org/ rsynciem; bez katalogu konczy sie
      # kodem 23. Git nie trzyma pustych folderow, wiec tworzymy go tutaj.
      - name: Katalog grafik
        run: mkdir -p .wordpress-org

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        if: steps.svn.outputs.ready == 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: lucjan-ai-image-disclosure
          IGNORE_OTHER_FILES: true

      - name: Pominieto aktualizacje
        if: steps.svn.outputs.ready != 'true'
        run: echo "Brak sekretow SVN_USERNAME / SVN_PASSWORD - nic nie poszlo do WordPress.org."
